<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <nav class="navbar">
        <a class="brand" href="/">QuickBite Admin</a>
        <a href="/">Customer Website</a>
    </nav>
</header>

<main class="section">
    <div id="adminLoginBox" class="card narrow">
        <p class="eyebrow">MANAGEMENT</p>
        <h2>Admin Login</h2>
        <form id="adminLoginForm">
            <input name="username" placeholder="Username" value="admin" required>
            <input name="password" type="password" placeholder="Password" value="admin123" required>
            <button class="btn" type="submit">Login</button>
        </form>
        <p id="adminLoginMsg" class="message"></p>
    </div>

    <div id="adminArea" class="hidden">
        <div class="section-title">
            <div>
                <p class="eyebrow">DASHBOARD</p>
                <h2>Order Management</h2>
            </div>
            <button class="btn secondary" onclick="loadAdminOrders()">Refresh</button>
        </div>

        <div class="card table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Customer</th>
                        <th>Restaurant</th>
                        <th>Total</th>
                        <th>Payment</th>
                        <th>Order Status</th>
                        <th>Delivery</th>
                    </tr>
                </thead>
                <tbody id="adminOrders"></tbody>
            </table>
        </div>
    </div>
</main>

<script src="/js/admin.js"></script>
</body>
</html>
